services:
  postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: optidigi-cms
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres', '-d', 'optidigi-cms']
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
