name: CMS image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cms-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/optidigi/optidigi-cms
  DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/cms_test
  PAYLOAD_SECRET: cms-integration-test-only
  PUBLIC_SERVER_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci -d cms_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/verify-ui.mjs
      - run: npm run lint
      - run: npx --no-install tsc --noEmit
      - run: npm run payload -- migrate
      - run: npm run test:int
      - run: npm audit --omit=dev --audit-level=high
      - name: Build the release image
        run: docker build --tag "$IMAGE:$GITHUB_SHA" .
      - name: Install Chromium for the admin journeys
        run: npx --no-install playwright install --with-deps chromium
      - name: Test the image against a fresh database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U ci cms_smoke
          key_dir="$(mktemp -d)"
          trap 'docker logs optidigi-cms-smoke 2>/dev/null || true; docker rm -f optidigi-cms-smoke >/dev/null 2>&1 || true; rm -rf "$key_dir"' EXIT
          openssl rand -hex 32 > "$key_dir/assistant_key"
          openssl rand -hex 32 > "$key_dir/preview_signing_key"
          chmod 644 "$key_dir/"*
          docker run --detach --name optidigi-cms-smoke --network host \
            --env DATABASE_URL=postgres://ci:ci@127.0.0.1:5432/cms_smoke \
            --env PAYLOAD_SECRET --env PUBLIC_SERVER_URL \
            --env ASSISTANT_KEY_FILE=/run/secrets/assistant_key \
            --env PREVIEW_SIGNING_KEY_FILE=/run/secrets/preview_signing_key \
            --mount "type=bind,source=$key_dir/assistant_key,target=/run/secrets/assistant_key,readonly" \
            --mount "type=bind,source=$key_dir/preview_signing_key,target=/run/secrets/preview_signing_key,readonly" \
            "$IMAGE:$GITHUB_SHA"
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-all-errors --max-time 5 http://localhost:3000/api/health
          docker exec optidigi-cms-smoke sh -ec 'test -r "$ASSISTANT_KEY_FILE" && test -r "$PREVIEW_SIGNING_KEY_FILE"'
          PLAYWRIGHT_BASE_URL=http://localhost:3000 DATABASE_URL=postgres://ci:ci@127.0.0.1:5432/cms_smoke \
            npm run test:e2e -- --reporter=line
      - name: Publish tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on main. Publishing is left to its workflow run."
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
